<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="favicon.png" type="image/png"><link rel="apple-touch-icon" href="favicon.png"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>じぶん発見ラボ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Klee+One:wght@600&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: a bright risograph zine. Ink-outlined white cards with hard shadows sit on a pastel ground that changes colour with each step; the finished report is one A4 sheet. One light look on purpose, so it never turns dark. */
:root{
  --ink:#22204a; --ink2:#55527c; --ink3:#9893bb; --line:#dcd7f0; --paper:#ffffff;
  --yellow:#ffc21a; --orange:#ff7a3d; --pink:#ff5c93; --red:#f0453a; --green:#22c07a; --mint:#7fe0b5;
  --blue:#4a94ff; --sky:#8fd0ff; --purple:#7a5cff; --lav:#c9b8ff; --cyan:#39c2e0;
  --pale-y:#fff1c4; --pale-p:#ffe1ec; --pale-g:#d9f6e8; --pale-b:#dfeaff; --pale-v:#ebe5ff;
  --no:#bdb8db; --no-pale:#e7e4f4;
  --bg:#fff3d1; --acc:var(--yellow); --acc-mid:#ffdc73; --acc-pale:var(--pale-y);
  --f-disp:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --f-hand:"Klee One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --grain:none;
  color-scheme:light;
}
body[data-step="pq"],body[data-step="presult"]{--bg:#ffe4ee;--acc:var(--pink);--acc-mid:#ffa6c4;--acc-pale:var(--pale-p)}
body[data-step="gate1"]{--bg:#ffe4ee;--acc:var(--pink);--acc-mid:#ffa6c4;--acc-pale:var(--pale-p)}
body[data-step="vals"],body[data-step="gate2"]{--bg:#ffead9;--acc:var(--orange);--acc-mid:#ffb88f;--acc-pale:#ffe6d6}
body[data-step="hope"]{--bg:#daf4e6;--acc:var(--green);--acc-mid:#8be0b8;--acc-pale:var(--pale-g)}
body[data-step="iq"]{--bg:#dde9ff;--acc:var(--blue);--acc-mid:#a6c9ff;--acc-pale:var(--pale-b)}
body[data-step="report"]{--bg:#e9e3ff;--acc:var(--purple);--acc-mid:#b9aaff;--acc-pale:var(--pale-v)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:500 16px/1.75 var(--f-body);transition:background-color .6s ease;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::after{content:"";position:fixed;inset:0;background-image:var(--grain);opacity:.45;pointer-events:none;z-index:60;mix-blend-mode:multiply}
img{max-width:100%}
.orb img,.a-emb,.pd .pi,.pd .crown{display:block}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:3px dashed var(--ink);outline-offset:4px}
.hand{font-family:var(--f-hand);font-weight:600}

/* ---------- background decoration ---------- */
#deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#deco .d{position:absolute;display:block}
.d-blob{width:340px;height:300px;left:-150px;bottom:-130px;background:var(--acc);border:2.5px solid var(--ink);border-radius:46% 54% 60% 40%/50% 42% 58% 50%;transition:background-color .6s}
.d-ring{width:230px;height:230px;right:-90px;top:110px;border:2.5px solid var(--ink);border-radius:50%}
.d-ring2{width:150px;height:150px;right:-50px;top:150px;border:2.5px dashed var(--ink);border-radius:50%;opacity:.5}
.d-dot{width:26px;height:26px;left:5%;top:150px;border-radius:50%;background:var(--yellow);border:2.5px solid var(--ink)}
.d-half{width:130px;height:65px;right:5%;bottom:28px;border-radius:130px 130px 0 0;background:var(--pink);border:2.5px solid var(--ink);transform:rotate(-12deg)}
.d-pill{width:90px;height:28px;left:12%;bottom:22%;border-radius:99px;background:var(--sky);border:2.5px solid var(--ink);transform:rotate(18deg)}
.d-squig{width:120px;right:12%;top:46%;transform:rotate(-8deg)}
.d-sp{width:30px;animation:twinkle 3.2s ease-in-out infinite}
.d-sp.a{left:18%;top:96px}.d-sp.b{right:20%;top:20%;animation-delay:1.1s;width:22px}.d-sp.c{left:8%;top:58%;animation-delay:2s;width:24px}
@keyframes twinkle{50%{transform:scale(.7) rotate(25deg)}}
body[data-step="report"] #deco .d-squig,body[data-step="report"] #deco .d-pill{display:none}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 4px}
.bar-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:6px 8px 6px 12px;box-shadow:0 4px 0 var(--ink)}
.logo{display:flex;align-items:center;gap:3px;font-family:var(--f-disp);font-size:15px;line-height:1;white-space:nowrap}
.tile{display:inline-grid;place-items:center;width:1.55em;height:1.55em;border:2px solid var(--ink);border-radius:.38em;background:var(--c);transform:rotate(var(--r,0deg));line-height:1}
.logo .word{margin-left:6px}
.steps{display:flex;gap:2px;list-style:none;margin:0;padding:0}
.steps li{display:flex;align-items:center;gap:5px;padding:3px 11px 3px 4px;border-radius:999px;font:900 13px/1 var(--f-body);color:var(--ink2);border:2px solid transparent;white-space:nowrap}
.steps li img{width:28px;height:28px}
.steps li.now{background:var(--acc);color:var(--ink);border-color:var(--ink)}
.steps li.done{color:var(--ink)}
.steps li.done span::after{content:" ✓"}
.steps li.todo img{opacity:.45;filter:grayscale(1)}

/* ---------- layout ---------- */
main{position:relative;z-index:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 90px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.wrap.narrow{max-width:760px}
.card{position:relative;background:var(--paper);border:2.5px solid var(--ink);border-radius:26px;box-shadow:6px 6px 0 var(--ink);padding:clamp(20px,4vw,34px);min-width:0}
.actions{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.actions.spread{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:12px 26px;border:2.5px solid var(--ink);border-radius:18px;background:var(--yellow);color:var(--ink);font:900 17px/1.3 var(--f-body);box-shadow:4px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{background:#eceaf6;color:var(--ink3);border-color:var(--ink3);box-shadow:3px 3px 0 var(--ink3);cursor:not-allowed;transform:none}
.btn.white{background:var(--paper)}
.btn.big{min-height:64px;font-size:19px;padding:14px 32px}
.btn .arr{font-family:var(--f-disp);font-weight:400}
.btn img{width:30px;height:30px;margin-left:-6px}
.link{background:none;border:0;padding:8px 2px;font:700 15px/1.3 var(--f-body);color:var(--ink2);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.link.danger{color:var(--red)}
.note{font-size:13px;line-height:1.7;color:var(--ink2)}
.sec-h{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.sec-h img{width:52px;height:52px;flex:none}
.sec-h h2{font:400 clamp(20px,3.4vw,25px)/1.3 var(--f-disp)}
.sec-h p{font-size:13.5px;line-height:1.6;color:var(--ink2);margin-top:2px}

/* ---------- start ---------- */
.start{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:clamp(20px,4vw,52px);align-items:center;padding-top:10px}
.kicker{font:600 15px/1.4 var(--f-hand);color:var(--ink2);display:inline-block;background:var(--paper);border:2px solid var(--ink);border-radius:99px;padding:4px 14px}
.logo-xl{display:flex;flex-wrap:wrap;align-items:center;font:400 clamp(44px,8.6vw,88px)/1 var(--f-disp);margin:.32em 0 .32em;gap:.06em}
.logo-xl .tile{width:1.1em;height:1.1em;border-width:3px;border-radius:.2em;box-shadow:.055em .055em 0 var(--ink);animation:drop .65s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i)*80ms)}
.logo-xl .word{margin-left:.16em;animation:drop .65s cubic-bezier(.2,1.5,.4,1) .26s both}
@keyframes drop{from{opacity:0;transform:translateY(-34px) rotate(0)}}
.lead{font:500 clamp(16px,2vw,18.5px)/1.9 var(--f-body);max-width:32em}
.lead b{font-weight:900;background:linear-gradient(transparent 58%,var(--yellow) 58%)}
.flow{list-style:none;margin:22px 0 20px;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.flow li{background:var(--paper);border:2.5px solid var(--ink);border-radius:18px;padding:12px 14px 13px;display:flex;flex-direction:column;gap:1px;box-shadow:3px 3px 0 var(--ink);transform:rotate(var(--r));min-width:0}
.flow img{width:46px;height:46px;margin:-2px 0 4px -4px}
.flow .k{font:900 11px/1.2 var(--f-body);letter-spacing:.14em;color:var(--ink2)}
.flow b{font:400 16.5px/1.35 var(--f-disp)}
.flow small{font-size:12.5px;line-height:1.55;color:var(--ink2)}
.form{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;margin-bottom:18px}
.field{min-width:0}
.field label{display:block;font:900 13px/1.4 var(--f-body);color:var(--ink2);margin-bottom:5px}
.inp{width:100%;min-width:0;border:2.5px solid var(--ink);border-radius:14px;padding:12px 14px;background:var(--paper);font:700 16px/1.4 var(--f-body)}
.inp:focus{outline:none;box-shadow:0 0 0 4px var(--acc-mid)}
.inp::placeholder{color:var(--ink3);font-weight:500}
.start-art{position:relative;width:100%;max-width:470px;aspect-ratio:1;justify-self:center}
.start-art .disc{position:absolute;inset:9%;border-radius:50%;background:var(--paper);border:2.5px solid var(--ink);box-shadow:9px 9px 0 var(--ink)}
.start-art .hero{position:absolute;inset:15%;width:70%;animation:pop .8s cubic-bezier(.2,1.5,.4,1) .2s both}
.orb{position:absolute;width:19%;transform:translate(-50%,-50%)}
.orb img{width:100%;animation:float 4.2s ease-in-out infinite;animation-delay:var(--d)}
.orb::before{content:"";position:absolute;inset:6%;border-radius:50%;background:var(--paper);border:2.5px solid var(--ink);z-index:-1;transform:rotate(var(--r))}
@keyframes float{50%{transform:translateY(-9px) rotate(5deg)}}
@keyframes pop{from{opacity:0;transform:scale(.4) rotate(-14deg)}}

/* ---------- quiz ---------- */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px}
.qlabel{display:flex;align-items:center;gap:10px}
.qlabel img{width:52px;height:52px}
.qlabel span{display:inline-block;font:900 11px/1 var(--f-body);letter-spacing:.14em;background:var(--ink);color:var(--paper);padding:5px 8px;border-radius:6px}
.qlabel b{display:block;font:400 21px/1.3 var(--f-disp);margin-top:4px}
.qcount{font:400 34px/1 var(--f-disp);font-variant-numeric:tabular-nums;white-space:nowrap}
.qcount small{font:900 15px/1 var(--f-body);color:var(--ink2)}
.track{position:relative;height:20px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);margin:18px 6px 0}
.track i{position:absolute;left:0;top:0;bottom:0;min-width:10px;background:var(--acc);border-radius:999px;transition:width .3s ease}
.track .runner{position:absolute;top:50%;width:42px;height:42px;transform:translate(-50%,-56%);transition:left .3s ease}
.qcard{margin-top:30px;text-align:center;padding:44px clamp(16px,4vw,40px) 30px;display:flex;flex-direction:column;gap:20px}
.qcard.fwd{animation:inR .32s ease-out}.qcard.bwd{animation:inL .32s ease-out}
@keyframes inR{from{opacity:0;transform:translateX(30px) rotate(1.2deg)}}
@keyframes inL{from{opacity:0;transform:translateX(-30px) rotate(-1.2deg)}}
.qno{position:absolute;top:-21px;left:22px;background:var(--acc);border:2.5px solid var(--ink);border-radius:14px;padding:7px 14px 6px;font:400 19px/1 var(--f-disp);transform:rotate(-4deg);box-shadow:3px 3px 0 var(--ink)}
.cheer{position:absolute;top:-24px;right:20px;background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;padding:6px 14px;font:600 14px/1.3 var(--f-hand);transform:rotate(3deg);animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.cheer::after{content:"";position:absolute;left:24px;bottom:-9px;width:14px;height:14px;background:var(--paper);border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg)}
.qprompt{font:600 16px/1.4 var(--f-hand);color:var(--ink2)}
.qtext{font:900 clamp(22px,4.4vw,30px)/1.55 var(--f-body);min-height:3.1em;display:flex;align-items:center;justify-content:center}
.opts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:9px;padding:15px 6px 13px;border:2.5px solid var(--ink);border-radius:18px;background:var(--paper);box-shadow:3px 3px 0 var(--ink);font:700 13px/1.4 var(--f-body);transition:transform .1s,box-shadow .1s,background-color .12s;min-width:0}
.opt:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.opt .dot{flex:none;width:var(--d);height:var(--d);border-radius:50%;border:2.5px solid var(--ink);background:var(--dc);transition:transform .15s}
.opt.o1{--d:32px;--dc:var(--acc)}.opt.o2{--d:25px;--dc:var(--acc-mid)}.opt.o3{--d:18px;--dc:var(--paper)}.opt.o4{--d:25px;--dc:var(--no-pale)}.opt.o5{--d:32px;--dc:var(--no)}
.opt.on{background:var(--acc-mid);transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.opt.on .dot{background:var(--ink);transform:scale(1.08)}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px}
.kbd{font-size:12.5px;color:var(--ink2)}

/* ---------- type reveal ---------- */
.reveal{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(18px,4vw,44px);align-items:center;overflow:hidden}
.rv-art{position:relative;width:100%;max-width:360px;aspect-ratio:1;justify-self:center}
.rv-art .burst{position:absolute;inset:-4%;border-radius:50%;background:repeating-conic-gradient(var(--acc-pale) 0 9deg,transparent 9deg 18deg);animation:spin 40s linear infinite}
.rv-art img{position:absolute;inset:8%;width:84%;animation:pop .8s cubic-bezier(.2,1.5,.4,1) both}
@keyframes spin{to{transform:rotate(360deg)}}
.rv-text{display:flex;flex-direction:column;gap:12px;min-width:0}
.rv-name{font:400 clamp(36px,6.6vw,56px)/1.15 var(--f-disp)}
.rv-catch{align-self:flex-start;font:900 17px/1.5 var(--f-body);background:var(--acc-pale);border:2px solid var(--ink);border-radius:10px;padding:2px 12px}
.rv-desc{font-size:16px;line-height:1.85}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:2px solid var(--ink);border-radius:999px;padding:3px 13px 3px 10px;font:900 14px/1.5 var(--f-body);background:var(--paper)}
.chip i{width:11px;height:11px;border-radius:50%;background:var(--c);border:1.5px solid var(--ink)}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.box{background:var(--acc-pale);border-radius:16px;padding:12px 15px;min-width:0}
.box h4{font:900 12px/1.4 var(--f-body);letter-spacing:.08em;color:var(--ink2)}
.box p{font-weight:700;line-height:1.6}
.confetti{position:absolute;left:28%;top:42%;width:0;height:0;pointer-events:none}
.confetti i{position:absolute;width:var(--w);height:calc(var(--w)*.62);background:var(--c);border:1.5px solid var(--ink);border-radius:2px;opacity:0;animation:fly 1.3s cubic-bezier(.12,.7,.3,1) var(--dl) forwards}
@keyframes fly{0%{opacity:1;transform:translate(0,0) rotate(0)}75%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
.st-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:26px;align-items:center}
.cv{position:relative;width:100%}
.cv canvas{position:absolute;inset:0;width:100%;height:100%}
.cv-str{aspect-ratio:4/3}
.st-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.st-list li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center}
.st-list b{font:900 16.5px/1.35 var(--f-body);display:block}
.st-list span{display:block;font-size:13px;line-height:1.55;color:var(--ink2)}
.rk{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:2.5px solid var(--ink);font:400 14px/1 var(--f-disp);font-style:normal;background:var(--lav)}
.rk.r1{background:var(--yellow)}.rk.r2{background:var(--pink)}.rk.r3{background:var(--sky)}.rk.r4,.rk.r5,.rk.r6{background:var(--pale-v)}

/* ---------- hope ---------- */
.hopes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pick{display:flex;flex-wrap:wrap;gap:9px}
.pick button{border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);padding:8px 16px;font:900 14.5px/1.35 var(--f-body);box-shadow:2px 2px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.pick button.on{background:var(--acc);transform:translate(2px,2px);box-shadow:none}
.pick button.on::before{content:"✓ "}
.seg-row{display:grid;grid-template-columns:8.5em minmax(0,1fr) 8.5em;gap:12px;align-items:center;padding:7px 0}
.seg-row>span{font:900 14px/1.4 var(--f-body)}
.seg-row>span:last-child{text-align:right}
.seg{position:relative;display:flex;justify-content:space-between;align-items:center;padding:0 2px}
.seg::before{content:"";position:absolute;left:14px;right:14px;top:50%;height:3px;border-radius:3px;background:var(--ink);transform:translateY(-50%)}
.seg button{position:relative;width:var(--s);height:var(--s);border-radius:50%;border:2.5px solid var(--ink);background:var(--paper);padding:0;transition:transform .12s}
.seg button:nth-child(1),.seg button:nth-child(5){--s:30px}.seg button:nth-child(2),.seg button:nth-child(4){--s:24px}.seg button:nth-child(3){--s:20px}
.seg button.on{background:var(--acc);box-shadow:0 0 0 4px var(--paper),0 0 0 6.5px var(--ink)}
.vals{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.vtile{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px 12px;border:2.5px solid var(--ink);border-radius:18px;background:var(--paper);box-shadow:3px 3px 0 var(--ink);font:900 13.5px/1.35 var(--f-body);text-align:center;transition:transform .1s,box-shadow .1s;min-width:0}
.vtile img{width:54px;height:54px}
.vtile.on{background:var(--acc-pale);transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.vtile .num{position:absolute;top:-13px;right:-9px;width:32px;height:32px;border-radius:50%;background:var(--acc);border:2.5px solid var(--ink);display:grid;place-items:center;font:400 15px/1 var(--f-disp)}
.hint{font:900 14px/1.4 var(--f-body);color:var(--ink2)}


/* ---------- think pages & gates ---------- */
.think{background:#fffdf5;border-style:dashed}
.think-no{flex:none;display:grid;place-items:center;text-align:center;width:66px;height:66px;border-radius:50%;background:var(--acc);border:2.5px solid var(--ink);font:900 11px/1.25 var(--f-body);transform:rotate(-6deg);box-shadow:3px 3px 0 var(--ink)}
.think-no b{display:block;font:400 20px/1 var(--f-disp)}

function compute(){
  const acc={}; FACETS.forEach(f=>acc[f.k]=[]);
  PQ.forEach((it,i)=>{ let v=S.pAns[i] ?? 3; if(it.r) v=6-v; acc[it.f].push(v); });
  const fs={}, fr={}; for(const k in acc){ fs[k]=avg100(acc[k]); fr[k]=(acc[k].reduce((s,v)=>s+v,0)/acc[k].length-1)/4*100; }
  const tr={}; for(const t of TORDER){ const ks=FACETS.filter(f=>f.t===t); tr[t]=ks.reduce((s,f)=>s+fr[f.k],0)/ks.length; }
  const tRank=[...TORDER].sort((a,b)=>tr[b]-tr[a] || TORDER.indexOf(a)-TORDER.indexOf(b));
  const gap=(tr[tRank[0]]+tr[tRank[1]])/2 - tRank.slice(2).reduce((s,t)=>s+tr[t],0)/(TORDER.length-2);
  const tkey= gap<TYPE_GAP ? "BAL" : tRank.slice(0,2).sort((a,b)=>TORDER.indexOf(a)-TORDER.indexOf(b)).join("");
  const top6=FACETS.map((f,i)=>({f,score:fs[f.k],raw:fr[f.k],i})).sort((a,b)=>b.raw-a.raw || a.i-b.i).slice(0,6).map((x,k)=>({...x,rank:k+1}));
  const ra={}; for(const L of RORDER) ra[L]=[];
  IQ.forEach((it,i)=>ra[it.t].push(S.iAns[i] ?? 3));
  const ri={}; for(const L of RORDER) ri[L]=avg100(ra[L]);
  const riRank=[...RORDER].sort((a,b)=>ri[b]-ri[a] || RORDER.indexOf(a)-RORDER.indexOf(b));
  const riFlat=ri[riRank[0]]-ri[riRank[5]]<10;
  const maxRi=Math.max(10,...Object.values(ri)), W=[3,2,1];
  const jobs=JOBS.map(j=>{
    let a=0; [...j.code].forEach((L,k)=>a+=W[k]*ri[L]); const fInt=a/(6*maxRi);
    const fPer=j.traits.reduce((s,t)=>s+tr[t],0)/j.traits.length/100;
    const ov=j.vals.filter(v=>S.values.includes(v)).length, fVal=[0.2,0.65,0.9,1][ov];
    const fSty=j.style.reduce((s,v,k)=>s+1-Math.abs(v-S.style[k])/4,0)/4;
    const fFld=S.fields.length ? (j.fields.some(f=>S.fields.includes(f))?1:0) : 0.5;
    const total=.52*fInt+.15*fPer+.12*fVal+.12*fSty+.09*fFld;
    return {...j,total,score:Math.round(total*100)};
  }).sort((a,b)=>b.total-a.total);
  jobs.forEach((j,k)=>j.rank=k+1);
  R={fs,tr,tkey,type:TYPES[tkey],emb:IMG["em_"+tkey]||IMG.discover,top6,ri,riRank,riFlat,jobs,gap};
  R.hopes=S.hopes.map(h=>h.trim()).filter(Boolean).map(h=>{ const j=findJob(h); return {q:h, job:j?jobs.find(x=>x.id===j.id):null}; });
  return R;
}
function jobStrengths(j){
  const fsr=FACETS.filter(f=>j.traits.includes(f.t)).sort((a,b)=>R.fs[b.k]-R.fs[a.k]);
  const use=fsr.slice(0,2);
  for(const x of R.top6){ if(use.length>=2) break; if(!use.includes(x.f)) use.push(x.f); }
  const low=fsr[fsr.length-1];
  return {use, grow: low && R.fs[low.k]<60 && !use.includes(low) ? low : null};
}
function reasons(j){
  const r=[];
  if(R.riRank.slice(0,2).includes(j.code[0])) r.push(`興味：${RI[j.code[0]].short}`);
  const v=j.vals.find(v=>S.values.includes(v)); if(v) r.push(`大切：${VAL[v].name}`);
  if(r.length<2 && j.fields.some(f=>S.fields.includes(f))) r.push("気になる分野");
  if(r.length<2){ const st=jobStrengths(j).use[0]; if(st) r.push(`強み：${st.name}`); }
  return r.slice(0,2);
}

/* ================= charts ================= */
const RANKC=["#ffc21a","#ff5c93","#8fd0ff","#ebe5ff","#ebe5ff","#ebe5ff"];
const dprScreen = () => Math.max(2, window.devicePixelRatio||1);
function prep(cv,dpr){ const w=cv.clientWidth, h=cv.clientHeight; cv.width=Math.max(1,Math.round(w*dpr)); cv.height=Math.max(1,Math.round(h*dpr)); const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h); return {c,w,h}; }
function drawStr(cv,dpr,prog){
  const {c,w,h}=prep(cv,dpr); if(w<20 || !R) return;
  const it=R.top6, POS=[0,1,3,5,4,2];
  const fs=Math.max(11.5,Math.min(16,w/27)), br=fs*0.7, gap=Math.max(7,w/42), lh=fs*1.5;
  const cx=w/2, cy=h/2+1;
  const lo=Math.min(...it.map(x=>x.score)), hi=Math.max(...it.map(x=>x.score));
  const dv=s=>hi===lo ? .92 : .56+.44*(s-lo)/(hi-lo);
  const ang=k=>-Math.PI/2+k*Math.PI/3;
  c.font=`900 ${fs}px ${FB}`;
  let Rr=Math.min(cy-gap-lh-2, h-2-cy-gap-lh);
  for(const k of [1,2,4,5]){ const lw=c.measureText(it[POS[k]].f.name).width+br*2+5; Rr=Math.min(Rr,(w/2-3-gap-lw)/0.866); }
  Rr=Math.max(28,Rr);
  const hex=r=>{ c.beginPath(); for(let k=0;k<6;k++){ const x=cx+Math.cos(ang(k))*r, y=cy+Math.sin(ang(k))*r; k?c.lineTo(x,y):c.moveTo(x,y); } c.closePath(); };
  hex(Rr); c.fillStyle="#fff6d6"; c.fill(); c.lineWidth=2; c.strokeStyle="#22204a"; c.stroke();
  c.setLineDash([3,4]); c.lineWidth=1.2; c.strokeStyle="#c9c2e6";
  [.25,.5,.75].forEach(f=>{ hex(Rr*f); c.stroke(); });
  for(let k=0;k<6;k++){ c.beginPath(); c.moveTo(cx,cy); c.lineTo(cx+Math.cos(ang(k))*Rr, cy+Math.sin(ang(k))*Rr); c.stroke(); }
  c.setLineDash([]);
  const pts=[0,1,2,3,4,5].map(k=>{ const v=dv(it[POS[k]].score)*prog; return [cx+Math.cos(ang(k))*Rr*v, cy+Math.sin(ang(k))*Rr*v]; });
  const poly=(dx,dy)=>{ c.beginPath(); pts.forEach(([x,y],k)=>k?c.lineTo(x+dx,y+dy):c.moveTo(x+dx,y+dy)); c.closePath(); };
  poly(3,3); c.fillStyle="rgba(255,92,147,.6)"; c.fill();
  poly(0,0); c.lineWidth=2.6; c.lineJoin="round"; c.strokeStyle="#22204a"; c.stroke();
  pts.forEach(([x,y],k)=>{ c.beginPath(); c.arc(x,y,Math.max(4,fs*.36),0,Math.PI*2); c.fillStyle=RANKC[POS[k]]; c.fill(); c.lineWidth=2; c.strokeStyle="#22204a"; c.stroke(); });
  for(let k=0;k<6;k++){
    const x0=it[POS[k]], co=Math.cos(ang(k)), si=Math.sin(ang(k));
    const ax=cx+co*(Rr+gap), ay=cy+si*(Rr+gap);
    c.font=`900 ${fs}px ${FB}`; const tw=c.measureText(x0.f.name).width, bw=br*2+5+tw;
    const sx = (k===0||k===3) ? ax-bw/2 : (co>0 ? ax : ax-bw);
    const yc = k===0 ? ay-lh/2 : k===3 ? ay+lh/2 : ay;
    if(x0.rank===1){ c.fillStyle="rgba(255,194,26,.9)"; c.fillRect(sx+br*2+3, yc+fs*.02, tw+4, fs*.52); }
    c.beginPath(); c.arc(sx+br,yc,br,0,Math.PI*2); c.fillStyle=RANKC[x0.rank-1]; c.fill(); c.lineWidth=1.8; c.strokeStyle="#22204a"; c.stroke();
    c.fillStyle="#22204a"; c.textAlign="center"; c.textBaseline="middle"; c.font=`400 ${fs*.78}px ${FD}`; c.fillText(String(x0.rank),sx+br,yc+.5);
    c.textAlign="left"; c.font=`900 ${fs}px ${FB}`; c.fillText(x0.f.name,sx+br*2+5,yc+.5);
  }
}
function drawCharts(root,dpr,prog=1){ root.querySelectorAll('canvas[data-chart="str"]').forEach(cv=>drawStr(cv,dpr,prog)); }
let fontsP=null;
function ensureFonts(){
  if(!fontsP){ const txt=FACETS.map(f=>f.name).join("")+"0123456789";
    fontsP=Promise.all([document.fonts.load(`900 14px "Zen Kaku Gothic New"`,txt),document.fonts.load(`400 14px "Dela Gothic One"`,"0123456789")]).catch(()=>{}); }
  return Promise.race([fontsP,new Promise(r=>setTimeout(r,2500))]);
}
async function paint(root=app){
  await ensureFonts();
  const cvs=[...root.querySelectorAll('canvas[data-chart]')]; if(!cvs.length) return;
  if(REDUCED){ drawCharts(root,dprScreen()); return; }
  const t0=performance.now(), back=t=>{ const s=1.5; t-=1; return t*t*((s+1)*t+s)+1; };
  const step=t=>{ const p=Math.min(1,(t-t0)/850); drawCharts(root,dprScreen(),back(p)); if(p<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

let busy=false;
const LBL={p:["とてもあてはまる","ややあてはまる","どちらともいえない","あまりあてはまらない","まったくあてはまらない"],
           i:["ぜひやってみたい","少しやってみたい","どちらともいえない","あまりやりたくない","まったくやりたくない"]};
function vQuiz(kind){
  app.className="wrap narrow";
  const list=kind==="p"?PQ:IQ, ans=kind==="p"?S.pAns:S.iAns, i=S.qi, n=list.length, it=list[i];
  const pct=i/n*100, run=Math.min(96,Math.max(4,pct));
  const third=Math.round(n/3);
  const msg = i===third ? `いいペース！ のこり${n-i}問` : i===third*2 ? `あと少し！ のこり${n-i}問` : i===n-1 ? "これで最後！" : "";
  app.innerHTML=`
  <div class="qtop">
    <div class="qlabel"><img src="${IMG[kind==="p"?"st_p":"st_i"]}" alt=""><div><span>STEP ${kind==="p"?1:4}</span><b>${kind==="p"?"性格診断":"職業適性診断"}</b></div></div>
    <div class="qcount" aria-label="${n}問中${i+1}問目">${i+1}<small> / ${n}</small></div>
  </div>
  <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${i}"><i style="width:${pct}%"></i><img class="runner" src="${IMG[kind==="p"?"st_p":"st_i"]}" alt="" style="left:${run}%"></div>
  <section class="card qcard ${dir}">
    <span class="qno">Q${i+1}</span>
    ${msg?`<span class="cheer">${msg}</span>`:""}
    <p class="qprompt">${kind==="p"?"ふだんのあなたに、あてはまる？":"これ、やってみたい？"}</p>
    <h2 class="qtext">${it.q}</h2>
    <div class="opts" role="radiogroup" aria-label="5段階で答える">
      ${[5,4,3,2,1].map((v,k)=>`<button class="opt o${k+1}${ans[i]===v?" on":""}" data-v="${v}" role="radio" aria-checked="${ans[i]===v}"><i class="dot"></i><span>${LBL[kind][k]}</span></button>`).join("")}
    </div>
  </section>
  <div class="qfoot"><button class="link" id="bk">← ひとつ前へ</button><span class="kbd">キーボードの 1〜5 でも答えられます</span></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(kind,+b.dataset.v));
  document.getElementById("bk").onclick=()=>{ dir="bwd"; if(S.qi>0){ S.qi--; save(); render(); } else { kind==="p" ? go("start") : go("hope"); } };
}
function answer(kind,v){
  if(busy) return; busy=true;
  const list=kind==="p"?PQ:IQ, ans=kind==="p"?S.pAns:S.iAns; ans[S.qi]=v; save();
  app.querySelectorAll(".opt").forEach(b=>{ const on=+b.dataset.v===v; b.classList.toggle("on",on); b.setAttribute("aria-checked",on); });
  setTimeout(()=>{ busy=false; dir="fwd";
    if(S.qi<list.length-1){ S.qi++; save(); render(); }
    else { S.qi=0; compute(); go(kind==="p"?"presult":"report"); }
  },230);
}
addEventListener("keydown",e=>{ if((S.step==="pq"||S.step==="iq") && /^[1-5]$/.test(e.key) && !e.target.closest("input,textarea")) answer(S.step==="pq"?"p":"i",6-Number(e.key)); });

function confetti(){ const cols=["#ffc21a","#ff5c93","#4a94ff","#22c07a","#7a5cff","#ff7a3d"]; let s="";
  for(let i=0;i<30;i++){ const a=Math.random()*Math.PI*2, d=110+Math.random()*200; s+=`<i style="--x:${(Math.cos(a)*d).toFixed(0)}px;--y:${(Math.sin(a)*d-50).toFixed(0)}px;--r:${(Math.random()*600-300).toFixed(0)}deg;--c:${cols[i%6]};--w:${(7+Math.random()*7).toFixed(1)}px;--dl:${(Math.random()*.18).toFixed(2)}s"></i>`; }
  return s; }

    if(!h.job) return `<li><div class="h-top"><b>${esc(h.q)}</b></div><p class="h-row">リストの${JOBS.length}職業にないため、相性は出していません。強み<b>「${R.top6[0].f.name}」</b>が活きる場面を調べてみよう。</p></li>`;

  }).join("")}</ul>`;
}

function fitSheet(redraw){
  const wrap=document.getElementById("sheetWrap"), sh=document.getElementById("sheet"); if(!wrap||!sh) return;
  const w=wrap.clientWidth, a4=w>=620, was=sh.classList.contains("is-a4");
  sh.classList.toggle("is-a4",a4);
  if(a4){ const s=Math.min(1,w/794); sh.style.transform=`translateX(-50%) scale(${s})`; wrap.style.height=Math.ceil(sh.offsetHeight*s)+"px"; }
  else { sh.style.transform=""; wrap.style.height=""; }
  if(redraw || was!==a4) drawCharts(sh,dprScreen());
}

    <div class="actions"><button class="link" id="fix">← 希望を入れなおす</button><button class="link danger" id="restart">最初からやりなおす</button></div>
  </div>`;
  const grow=t=>{ t.style.height="auto"; t.style.height=t.scrollHeight+"px"; };
  app.querySelectorAll(".life-in").forEach(t=>{ grow(t); t.addEventListener("input",()=>{ S[t.dataset.k]=t.value; save(); grow(t); fitSheet(false); }); });
  document.getElementById("fix").onclick=()=>{ dir="bwd"; go("hope"); };
  const rs=document.getElementById("restart");
  rs.onclick=()=>{ if(!rs.dataset.armed){ rs.dataset.armed="1"; rs.textContent="本当に消してやりなおす？（もう一度押す）"; setTimeout(()=>{ if(rs.isConnected){ delete rs.dataset.armed; rs.textContent="最初からやりなおす"; } },4000); return; }
    const n=S.name, c=S.cls; S=fresh(); S.name=n; S.cls=c; try{ localStorage.removeItem(KEY); }catch(e){} dir="fwd"; go("start"); };
  app.querySelectorAll(".pdfbtn").forEach(b=>b.onclick=makePdf);
  fitSheet(false);
  ensureFonts().then(()=>{ fitSheet(false); paint(document.getElementById("sheet")); });
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>fitSheet(false));
  dlP.then(dl=>{ if(!dl) app.querySelectorAll(".status").forEach(s=>s.textContent="※ この画面ではPDF保存が使えません。claude.ai でこのページを開いてください。"); });
}

/* ================= PDF (one A4 page) ================= */
const dlP = (window.claude && typeof window.claude.use==="function") ? window.claude.use("downloads").catch(()=>null) : Promise.resolve(null);
async function makePdf(){
  const btns=[...app.querySelectorAll(".pdfbtn")], st=[...app.querySelectorAll(".status")];
  const say=(t,err)=>st.forEach(s=>{ s.textContent=t; s.classList.toggle("err",!!err); });
  const dl=await dlP;
  if(!dl){ say("この画面ではPDF保存が使えません。claude.ai でこのページを開いてください。",true); return; }
  if(!window.html2canvas || !window.jspdf){ say("PDFの準備中です。数秒後にもう一度押してください。",true); return; }
  btns.forEach(b=>b.disabled=true); say("PDFを作っています…");
  const paper=document.getElementById("paper");
  try{
    paper.innerHTML=`<article class="a4 is-a4">${sheetHTML("pdf")}</article>`;
    const sheet=paper.firstElementChild;
    await ensureFonts(); try{ await document.fonts.ready; }catch(e){}
    await Promise.all([...sheet.querySelectorAll("img")].map(im=>im.decode?im.decode().catch(()=>{}):null));
    drawCharts(sheet,3);
    const scale = window.devicePixelRatio>=2 ? 2.5 : 2.2;
    const canvas=await window.html2canvas(sheet,{scale,backgroundColor:"#ffffff",logging:false,useCORS:true,
      onclone:doc=>{ const p=doc.getElementById("paper"); if(p){ p.style.left="0px"; p.style.top="0px"; } }});
    const pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4",orientation:"portrait"});
    const pw=210, ph=297, r=canvas.height/canvas.width;
    let w=pw, h=pw*r; if(h>ph){ h=ph; w=ph/r; }
    pdf.addImage(canvas.toDataURL("image/jpeg",0.93),"JPEG",(pw-w)/2,0,w,h);
    const blob=pdf.output("blob");
    say("保存の確認画面を開いています…");
    await dl.save({filename:`じぶん発見レポート_${(S.name.trim()||"わたし").replace(/[\\/:*?"<>|]/g,"")}.pdf`, data:blob});
    say("PDFを保存しました。");
  }catch(e){
    const code=e&&e.code;
    if(code==="declined") say("保存をキャンセルしました。");
    else if(code==="rate_limited") say("少し待ってから、もう一度押してください。",true);
    else say("PDFを作れませんでした。もう一度ためしてください。",true);
  }finally{ paper.innerHTML=""; btns.forEach(b=>b.disabled=false); }
}
